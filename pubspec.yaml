name: feedbackjar
description: >-
  Flutter SDK for FeedbackJar — collect user feedback with automatic device
  metadata. You build the UI; the SDK handles submission and listing.
version: 1.7.0
homepage: https://feedbackjar.com

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.1.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
